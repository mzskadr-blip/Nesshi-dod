<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <style>
    * {
      font-family: 'DotGothic16', monospace;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
    body {
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      background-color: #050a18;
      background-image:
        radial-gradient(#132347 1px, transparent 1px),
        radial-gradient(#0c1733 1px, #050a18 1px);
      background-size: 16px 16px;
      background-position: 0 0, 8px 8px;
    }

    /* レトロRPGコマンドウィンドウ風 */
    .rpg-window {
      background-color: #0b1429;
      border: 3px solid #cbd5e1;
      box-shadow:
        0 0 0 3px #020617,
        inset 0 0 0 3px #1e293b,
        6px 6px 0 0 rgba(0, 0, 0, 0.7);
    }
    .rpg-window-amber {
      background-color: #1c1408;
      border: 3px solid #fbbf24;
      box-shadow:
        0 0 0 3px #020617,
        inset 0 0 0 3px #451a03,
        6px 6px 0 0 rgba(0, 0, 0, 0.7);
    }
    .rpg-window-purple {
      background-color: #180c29;
      border: 3px solid #c084fc;
      box-shadow:
        0 0 0 3px #020617,
        inset 0 0 0 3px #3b0764,
        6px 6px 0 0 rgba(0, 0, 0, 0.7);
    }
    .rpg-subbox {
      background-color: #070d1c;
      border: 2px solid #475569;
      box-shadow: inset 2px 2px 0 0 rgba(0, 0, 0, 0.6);
    }

    /* 物理ドットボタン */
    .pixel-btn {
      border: 2px solid #e2e8f0;
      box-shadow:
        0 4px 0 0 #020617,
        inset -2px -2px 0 0 rgba(0, 0, 0, 0.4),
        inset 2px 2px 0 0 rgba(255, 255, 255, 0.25);
      transition: transform 0.05s, box-shadow 0.05s;
    }
    .pixel-btn:hover:not(:disabled) {
      filter: brightness(1.1);
    }
    .pixel-btn:active:not(:disabled) {
      transform: translateY(3px);
      box-shadow:
        0 1px 0 0 #020617,
        inset -1px -1px 0 0 rgba(0, 0, 0, 0.4);
    }
    .pixel-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    /* アナログカード枠 */
    .pixel-card {
      border: 3px solid #64748b;
      box-shadow: 4px 4px 0 0 #020617;
    }
    .pixel-card-selected {
      border: 3px solid #fbbf24;
      box-shadow: 0 0 0 2px #78350f, 4px 4px 0 0 #020617;
    }

    /* ドットスクロールバー */
    .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #070d1c; border-left: 1px solid #334155; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #475569; border: 1px solid #94a3b8; }

    /* スタンプ弾幕ポップアップアニメーション */
    @keyframes popSlideIn {
      0% { transform: translateY(-16px) scale(0.9); opacity: 0; }
      15% { transform: translateY(0) scale(1.03); opacity: 1; }
      25% { transform: translateY(0) scale(1); opacity: 1; }
      85% { transform: translateY(0) scale(1); opacity: 1; }
      100% { transform: translateY(-10px) scale(0.95); opacity: 0; }
    }
    .stamp-popup {
      animation: popSlideIn 4.2s forwards;
    }

    @keyframes pixelFloat {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-3px); }
    }
    .pixel-float {
      animation: pixelFloat 1.6s steps(2, end) infinite;
    }
  </style>

function renderPixelAsset(key, fallbackEmoji = '🎴') {
  const customUrl = CUSTOM_ASSETS[key];
  if (customUrl) {
    return `<img src="${escapeHtml(customUrl)}" alt="${key}" class="w-full h-full object-contain" />`;
  }
  if (PIXEL_SVGS[key]) {
    return PIXEL_SVGS[key];
  }
  return `<span class="flex items-center justify-center w-full h-full text-lg">${fallbackEmoji}</span>`;
}

/**
 * =============================================================
 * 8bit ピコピコ効果音エンジン (Web Audio API)
 * =============================================================
 */
let soundEnabled = localStorage.getItem('nessie_sound') !== 'off';
let audioCtx = null;

function initAudio() {
  if (!audioCtx) {
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (AudioCtx) audioCtx = new AudioCtx();
  }
  if (audioCtx && audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
}

function toggleSound() {
  soundEnabled = !soundEnabled;
  localStorage.setItem('nessie_sound', soundEnabled ? 'on' : 'off');
  updateSoundButton();
  if (soundEnabled) playSound('blip');
}

function updateSoundButton() {
  const btn = document.getElementById('soundToggleBtn');
  if (btn) {
    btn.innerHTML = soundEnabled ? '🔊 音ON' : '🔇 音OFF';
    btn.className = `pixel-btn px-2.5 py-1 text-xs flex items-center gap-1 ${soundEnabled ? 'bg-slate-800 text-amber-300' : 'bg-slate-900 text-slate-500'}`;
  }
}

function playTone(freq, duration, type = 'square', delay = 0, vol = 0.06) {
  if (!soundEnabled) return;
  try {
    initAudio();
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime + delay);
    gain.gain.setValueAtTime(vol, audioCtx.currentTime + delay);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + delay + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(audioCtx.currentTime + delay);
    osc.stop(audioCtx.currentTime + delay + duration);
  } catch (e) {}
}

function playSound(name) {
  if (!soundEnabled) return;
  switch (name) {
    case 'blip':
      playTone(660, 0.06, 'square', 0, 0.05);
      break;
    case 'confirm':
      playTone(523, 0.07, 'square', 0, 0.05);
      playTone(784, 0.1, 'square', 0.06, 0.05);

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

  if (prevPhase !== null && prevPhase !== phase) {

    if (curBoatPos > prevBoatPos) playSound('boatUp');

  prevBoatPos = isNaN(curBoatPos) ? null : curBoatPos;

function selectCardOption(idx) {
  localSelectedCardIndex = idx;
  render();
}

function handleShareSelectedCard(forceIdx = null) {
  const threeCards = toArray(roomData.state?.threeCards);
  const chosenIdx = forceIdx !== null ? forceIdx : localSelectedCardIndex;
  const selectedCard = threeCards[chosenIdx] || threeCards[0] || FREE_CARD;
  const curHintRound = Number(roomData.state?.hintRound) || 1;
  const queue = toArray(roomData.state?.questionQueue);
  const curIdx = Number(roomData.state?.currentQuestionIndex) || 0;
  const askerId = queue[curIdx] || myPlayerId;

  const updates = {};
  updates['state/phase'] = 'QUESTION_ORAL';
  updates['state/currentQuestionCard'] = selectedCard;
  updates[`state/cardHistory/${curHintRound}/${askerId}`] = selectedCard;

  roomRef.update(updates);
}

function handleFinishQuestionTurn() {
  const queue = toArray(roomData.state?.questionQueue);
  const curIdx = Number(roomData.state?.currentQuestionIndex) || 0;
  const nextIdx = curIdx + 1;
  const isEnd = nextIdx >= queue.length;
  const currentCard = roomData.state?.currentQuestionCard || FREE_CARD;

  if (isEnd) {
    localTyping.inference = '';
    isSubmittingInference = false;
    roomRef.child('state').update({
      phase: 'INFERENCE_INPUT',
      inferences: {},
      lastUsedCard: currentCard,
      currentQuestionCard: null
    });
  } else {
    const drawn = drawThreeCards(roomData.state?.markedDeck || []);
    localSelectedCardIndex = 0;
    roomRef.child('state').update({
      phase: 'QUESTION_CHOOSE',
      currentQuestionIndex: nextIdx,
      threeCards: drawn.cards,
      markedDeck: drawn.deck,
      lastUsedCard: currentCard,
      currentQuestionCard: null
    });
  }
}

  const submittedCount = Object.keys(roomData.state.inferences || {}).length;

/**
 * 9. 正解者投票結果
 */
function renderScoopResultGuesserScreen() {
  const isHost = roomData.hostId === myPlayerId;
  const votes = roomData.state.guesserVotes || {};
  const reporters = Object.keys(roomData.players).filter(pid => pid !== roomData.state.witnessId);
  const correctPids = Object.entries(roomData.state.inferences || {})
    .filter(([_, inf]) => inf.isCorrect)
    .map(([pid]) => pid);

  const voteCounts = {};
  reporters.forEach(pid => voteCounts[pid] = 0);
  Object.values(votes).forEach(target => {
    voteCounts[target] = (voteCounts[target] || 0) + 1;
  });

  let correctTargetVotes = 0;
  Object.entries(votes).forEach(([voter, target]) => {
    if (correctPids.includes(target)) correctTargetVotes++;
  });

  const threshold = Math.floor(reporters.length / 2) + 1;
  const isGuesserIdentified = correctTargetVotes >= threshold;

  return `
    <div class="rpg-window p-5 space-y-5 text-center">
      <div>
        <span class="text-xs text-emerald-300">★ スクープ会議 投票結果</span>
        <h2 class="text-xl text-slate-100 mt-1">誰が正解を当てていたか？</h2>
      </div>

      <div class="space-y-2 text-left">
        ${reporters.map(pid => {
          const isActuallyCorrect = correctPids.includes(pid);
          const cnt = voteCounts[pid] || 0;
          return `
            <div class="p-3 border-2 ${isActuallyCorrect ? 'border-amber-400 bg-amber-950/40' : 'border-slate-700 bg-[#070d1c]'} flex justify-between items-center">
              <div>
                <div class="flex items-center gap-1.5">
                  <span class="text-sm text-slate-200">${escapeHtml(roomData.players[pid].name)}</span>
                  ${isActuallyCorrect ? '<span class="text-[10px] bg-amber-400 text-slate-950 px-1.5 py-0.5">正解者!⭕</span>' : ''}
                </div>
                <div class="text-xs text-slate-400 mt-0.5">推理: 「${escapeHtml(roomData.state.inferences[pid]?.text || '')}」</div>
              </div>
              <div class="text-base text-amber-300">${cnt} 票</div>
            </div>
          `;
        }).join('')}
      </div>

      <div class="p-4 border-2 text-center ${
        isGuesserIdentified ? 'bg-emerald-950 border-emerald-400 text-emerald-200' : 'bg-rose-950 border-rose-400 text-rose-200'
      }">
        <div class="text-xl mb-1">
          ${isGuesserIdentified ? '🎉 正解者の特定に成功！' : '😱 正解者を特定できず！'}
        </div>
        <p class="text-xs opacity-90 leading-relaxed">
          正解者への投票数: ${correctTargetVotes}票 / 必要数: ${threshold}票（記者の半数超）<br>
          ${isGuesserIdentified ? 
            (roomData.mode === 'INSIDER' ? 'インサイダー特定（投票）へ進みます！' : '記者チームの勝利です！') : 
            (roomData.mode === 'INSIDER' ? '正体特定失敗ですが、インサイダー投票へ進みます！' : '正体は永遠の謎となり、目撃者の勝利です！')}
        </p>
      </div>

      ${isHost ? `
        <button onclick="handleProceedAfterGuesserVote(${isGuesserIdentified})" class="pixel-btn w-full bg-emerald-700 text-white py-3.5 text-sm">
          ${roomData.mode === 'INSIDER' ? '▶ インサイダー投票へ進む ➔' : '▶ ラウンド結果へ進む ➔'}

      ` : `
        <div class="text-xs text-slate-400 animate-pulse">▶ 隊長が次へ進めるのを待機中...</div>
      `}
    </div>
  `;
}

}

/**
 * 13. 最終ランキング
 */
function renderSetCompleteScreen() {
  const isHost = roomData.hostId === myPlayerId;
  const isNormal = roomData.mode === 'NORMAL';
  const players = Object.values(roomData.players || {});
  
  if (isNormal) {
    players.sort((a, b) => (b.correctCount || 0) - (a.correctCount || 0));
  } else {
    players.sort((a, b) => (b.score || 0) - (a.score || 0));
  }

  let currentRank = 1;
  const rankedList = players.map((p, idx) => {
    const val = isNormal ? (p.correctCount || 0) : (p.score || 0);
    const prevVal = idx > 0 ? (isNormal ? (players[idx - 1].correctCount || 0) : (players[idx - 1].score || 0)) : null;
    if (idx > 0 && val < prevVal) currentRank = idx + 1;
    const isMe = p.id === myPlayerId;

    return `
      <div class="flex items-center justify-between p-3 border-2 ${
        currentRank === 1 ? 'bg-amber-950/60 border-amber-400' :
        isMe ? 'bg-emerald-950/50 border-emerald-400' : 'bg-[#070d1c] border-slate-700'
      }">
        <div class="flex items-center gap-3">
          <span class="text-lg w-6 text-center ${currentRank === 1 ? 'text-amber-300 text-xl' : 'text-slate-400'}">
            ${currentRank === 1 ? '👑' : currentRank}
          </span>
          <span class="text-sm ${isMe ? 'text-emerald-300' : 'text-slate-200'}">${escapeHtml(p.name)}</span>
        </div>
        <div class="text-amber-300 text-base">
          ${val} <span class="text-xs text-slate-400">${isNormal ? '問正解' : '点'}</span>
        </div>
      </div>
    `;
  }).join('');

  return `
    <div class="rpg-window-amber p-6 space-y-6 text-center">
      <div>
        <div class="text-4xl">🏆</div>
        <h2 class="text-2xl text-amber-300 mt-2">ゲームセット終了！</h2>
        <p class="text-xs text-slate-300 mt-1">全員が目撃者を担当しました</p>
      </div>

      <div class="space-y-2 text-left">${rankedList}</div>

      ${isHost ? `
        <button onclick="handleStartGameSet()" class="pixel-btn w-full bg-emerald-700 text-white py-3.5 text-sm">
          ▶ もう1セット遊ぶ
        </button>
      ` : ''}
    </div>
  `;
}

/**
 * -------------------------------------------------------------
 * リアクションスタンプ送受信（本体画面の再描画を起こさない独立パス）
 * -------------------------------------------------------------
 */
function sendReactionStamp(stampId) {
  if (!currentRoomId) return;
  const now = Date.now();
  if (now - lastStampCooldown < 600) return;
  lastStampCooldown = now;

  const stamp = REACTION_STAMPS.find(s => s.id === stampId);
  if (!stamp) return;

  initAudio();
  const eventId = now + '_' + Math.random().toString(36).substring(2, 6);
  db.ref('reactions/' + currentRoomId).set({
    id: eventId,
    pid: myPlayerId,
    name: myName || '探検家',
    stampId: stamp.id,
    icon: stamp.icon,
    text: stamp.text,
    color: stamp.color,
    ts: now
  });
}

function attachReactionListener(roomCode) {
  if (reactionRef) reactionRef.off();
  reactionStartTime = Date.now();
  lastSeenReactionId = null;

  reactionRef = db.ref('reactions/' + roomCode);
  reactionRef.on('value', snap => {
    if (!snap.exists()) return;
    const data = snap.val();
    if (!data || !data.id) return;
    if (data.id === lastSeenReactionId) return;
    if (data.ts && data.ts < reactionStartTime - 2000) return;

    lastSeenReactionId = data.id;
    showReactionPopup(data);
  });
}

function showReactionPopup(data) {
  playSound('stamp');
  const layer = document.getElementById('reactionLayer');
  if (!layer) return;

  while (layer.children.length >= 4) {
    layer.removeChild(layer.firstChild);
  }

  const box = document.createElement('div');
  box.className = `stamp-popup rpg-window px-3.5 py-2 flex items-center gap-2.5 shadow-2xl border-2 ${data.color || 'bg-slate-900 border-amber-300 text-white'}`;
  box.innerHTML = `
    <span class="text-lg leading-none">${escapeHtml(data.icon || '💬')}</span>
    <div class="text-xs sm:text-sm leading-tight">
      <span class="text-amber-300">${escapeHtml(data.name)}</span>
      <span class="text-slate-400">「</span><span>${escapeHtml(data.text)}</span><span class="text-slate-400">」</span>
    </div>
  `;
  layer.appendChild(box);

  setTimeout(() => {
    if (box.parentNode === layer) layer.removeChild(box);
  }, 4300);
}

/**
 * -------------------------------------------------------------
 * ネットワーク＆ロジック操作
 * -------------------------------------------------------------
 */
function handleCreateRoom() {
  initAudio();
  const name = document.getElementById('inputPlayerName').value.trim();
  if (!name) return showToast('名前を入力してください');
  myName = name;
  localStorage.setItem('nessie_pname', myName);

  const code = Math.random().toString(36).substring(2, 8).toUpperCase();
  currentRoomId = code;
  roomRef = db.ref('rooms/' + code);

  roomRef.set({
    code: code,
    hostId: myPlayerId,
    mode: 'NORMAL',
    state: { phase: 'LOBBY' },
    players: { [myPlayerId]: { id: myPlayerId, name: myName, score: 0, correctCount: 0, online: true } }
  }).then(() => attachRoomListener()).catch(e => showToast(e.message));
}

function handleJoinRoom() {
  initAudio();
  const name = document.getElementById('inputPlayerName').value.trim();
  const code = document.getElementById('inputRoomCode').value.trim().toUpperCase();
  if (!name) return showToast('名前を入力してください');
  if (!code || code.length !== 6) return showToast('6桁のコードを入力してください');

  myName = name;
  localStorage.setItem('nessie_pname', myName);
  currentRoomId = code;
  roomRef = db.ref('rooms/' + code);

  roomRef.get().then(snap => {
    if (!snap.exists()) return showToast('ルームが見つかりません');
    const data = snap.val();
    if (Object.keys(data.players || {}).length >= 8 && !data.players[myPlayerId]) return showToast('満員です');

    roomRef.child('players/' + myPlayerId).set({
      id: myPlayerId,
      name: myName,
      score: data.players?.[myPlayerId]?.score || 0,
      correctCount: data.players?.[myPlayerId]?.correctCount || 0,
      online: true
    }).then(() => attachRoomListener());
  }).catch(e => showToast(e.message));
}

function attachRoomListener() {
  prevPhase = null;
  prevBoatPos = null;
  roomRef.child('players/' + myPlayerId).onDisconnect().update({ online: false });
  attachReactionListener(currentRoomId);

  roomRef.on('value', snap => {
    if (!snap.exists()) {
      showToast('ルームが解散されました');
      if (reactionRef) reactionRef.off();
      currentRoomId = null; roomData = null; render(); return;
    }
    roomData = snap.val();

    if (!roomData.players[roomData.hostId]?.online) {
      const activeIds = Object.keys(roomData.players).filter(id => roomData.players[id].online);
      if (activeIds.length > 0 && activeIds[0] === myPlayerId) {
        roomRef.update({ hostId: myPlayerId });
      }
    }
    render();
  });
}

function setGameMode(mode) {
  if (roomData.hostId !== myPlayerId) return;
  roomRef.update({ mode: mode });
}

function handleStartGameSet() {
  const pids = Object.keys(roomData.players || {});
  if (pids.length < 4) return showToast('4人以上必要です');

  const updates = {};
  pids.forEach(pid => {
    updates[`players/${pid}/score`] = 0;
    updates[`players/${pid}/correctCount`] = 0;
  });
  roomRef.update(updates).then(() => {
    startNewWitnessGame([]);
  });
}

function startNewWitnessGame(playedWitnesses = []) {
  const allPids = Object.keys(roomData.players || {});
  const remainingWitnesses = allPids.filter(pid => !playedWitnesses.includes(pid));

  if (remainingWitnesses.length === 0) {
    roomRef.child('state').update({ phase: 'SET_COMPLETE' });
    return;
  }

  const nextWitnessId = remainingWitnesses[Math.floor(Math.random() * remainingWitnesses.length)];
  const newPlayedList = [...playedWitnesses, nextWitnessId];

  const nonWitnesses = allPids.filter(pid => pid !== nextWitnessId);
  const insiderId = nonWitnesses[Math.floor(Math.random() * nonWitnesses.length)];

  localSuggestedTopics = getRandomTopics(3);
  localTyping.secretWord = '';

  roomRef.update({
    'state': {
      phase: 'SETUP',
      hintRound: 1,
      playedWitnesses: newPlayedList,
      witnessId: nextWitnessId,
      insiderId: insiderId,
      secretWord: '',
      boatPos: 0,
      markedDeck: createMarkedDeck(),
      currentQuestionIndex: 0,
      threeCards: [],
      inferences: {},
      history: [],
      cardHistory: {},
      guesserVotes: {},
      votes: {},
      secretRevealed: false,
      questionPool: shuffle(nonWitnesses)
    }
  });
}

function getNextQuestionQueue(currentPool, nonWitnesses, count = 3) {
  let pool = [...currentPool];
  const queue = [];

  for (let i = 0; i < count; i++) {
    if (pool.length === 0) {
      pool = shuffle(nonWitnesses);
    }
    queue.push(pool.shift());
  }
  return { queue, pool };
}

function submitSetup() {
  const word = localTyping.secretWord.trim();
  if (!word) return showToast('正体の言葉を入力するか候補を選んでください');

  const pids = Object.keys(roomData.players || {});
  const witnessId = roomData.state.witnessId;
  const nonWitnesses = pids.filter(id => id !== witnessId);

  const initialPool = toArray(roomData.state.questionPool).length > 0 ? toArray(roomData.state.questionPool) : shuffle(nonWitnesses);
  const result = getNextQuestionQueue(initialPool, nonWitnesses, Math.min(3, nonWitnesses.length));

  const drawnCards = drawThreeCards(roomData.state.markedDeck || []);

  localSelectedCardIndex = 0;
  roomRef.child('state').update({
    phase: 'QUESTION_CHOOSE',
    secretWord: word,
    boatPos: 0,
    questionQueue: result.queue,
    questionPool: result.pool,
    currentQuestionIndex: 0,
    threeCards: drawnCards.cards,
    markedDeck: drawnCards.deck,
    currentQuestionCard: null,
    inferences: {},
    secretRevealed: false
  });
}

function drawThreeCards(deck) {
  let curDeck = toArray(deck);
  if (curDeck.length < 2) curDeck = createMarkedDeck();

  const c1 = curDeck.pop();
  const c2 = curDeck.pop();
  return {
    cards: [FREE_CARD, c1, c2],
    deck: curDeck
  };
}

function handleSubmitInference() {
  if (isSubmittingInference || roomData.state?.inferences?.[myPlayerId]) return;
  const text = localTyping.inference.trim();
  if (!text) return showToast('推理を入力してください');

  isSubmittingInference = true;
  const btn = document.getElementById('btnSubmitInference');
  if (btn) {
    btn.disabled = true;
    btn.textContent = '⏳ 送信中...';
  }
  playSound('blip');

  roomRef.child('state/inferences/' + myPlayerId).set({
    name: myName,
    text: text,
    isCorrect: null,
    isClosest: false
  }).then(() => {
    roomRef.child('state/inferences').get().then(snap => {
      const infs = snap.val() || {};
      const reporters = Object.keys(roomData.players || {}).filter(id => id !== roomData.state.witnessId);
      if (Object.keys(infs).length >= reporters.length) {
        roomRef.child('state').update({ phase: 'INFERENCE_JUDGE' });
      }
    });
  }).catch(e => {
    isSubmittingInference = false;
    if (btn) {
      btn.disabled = false;
      btn.textContent = '▶ 推理を確定して送信';
    }
    showToast('送信エラー: ' + e.message);
  });
}

function toggleJudgeCorrect(targetPid, boolVal) {
  roomRef.child(`state/inferences/${targetPid}`).update({ isCorrect: boolVal });
}

function setClosestAnswer(targetPid) {
  const inferences = roomData.state.inferences || {};
  const updates = {};
  Object.keys(inferences).forEach(pid => {
    updates[`state/inferences/${pid}/isClosest`] = (pid === targetPid);
  });
  roomRef.update(updates);
}

function finishJudging() {
  const inferences = roomData.state.inferences || {};
  const hasUnjudged = Object.values(inferences).some(inf => inf.isCorrect === null);
  if (hasUnjudged) return showToast('全員の回答に⭕または❌をつけてください');

  let closestText = '';
  Object.entries(inferences).forEach(([pid, inf]) => {
    if (inf.isClosest) closestText = inf.text;
  });

  const curPos = Number(roomData.state.boatPos) || 0;
  const dist = 10 - curPos;
  const distanceText = dist <= 0 ? '到達！' : `残り ${dist}m`;

  const currentHistory = toArray(roomData.state?.history);
  const newLogEntry = {
    hintRound: roomData.state.hintRound,
    inferences: inferences,
    closestText: closestText,
    distanceText: distanceText
  };
  const updatedHistory = [...currentHistory, newLogEntry];

  const hasCorrect = Object.values(inferences).some(inf => inf.isCorrect === true);

  if (hasCorrect) {
    updatedHistory[updatedHistory.length - 1].distanceText = '到達！';
    roomRef.child('state').update({
      boatPos: 10,
      phase: 'SCOOP_VOTE_GUESSER',
      guesserVotes: {},
      history: updatedHistory
    });
  } else {
    roomRef.child('state').update({
      phase: 'SHIP_MOVE',
      history: updatedHistory
    });
  }
}

function handleAdjustBoat(delta) {
  const cur = Number(roomData.state.boatPos) || 0;
  const next = Math.max(0, Math.min(10, cur + delta));
  
  const currentHistory = toArray(roomData.state?.history);
  if (currentHistory.length > 0) {
    const dist = 10 - next;
    currentHistory[currentHistory.length - 1].distanceText = dist <= 0 ? '到達！' : `残り ${dist}m`;
  }

  roomRef.child('state').update({
    boatPos: next,
    history: currentHistory
  });
}

function confirmBoatMoveAndProceed() {
  const curHintRound = Number(roomData.state.hintRound) || 1;
  const curPos = Number(roomData.state.boatPos) || 0;
  const dist = 10 - curPos;
  const finalDistText = dist <= 0 ? '到達！' : `残り ${dist}m`;

  const currentHistory = toArray(roomData.state?.history);
  if (currentHistory.length > 0) {
    currentHistory[currentHistory.length - 1].distanceText = finalDistText;
  }

  if (curHintRound >= 5) {
    if (roomData.mode === 'INSIDER') {
      roomRef.child('state').update({
        secretRevealed: false,
        phase: 'INSIDER_VOTE',
        votes: {},
        history: currentHistory
      });
    } else {
      roomRef.child('state/history').set(currentHistory).then(() => {
        applyRoundResults(false, []);
      });
    }
  } else {
    const pids = Object.keys(roomData.players || {});
    const nonWitnesses = pids.filter(id => id !== roomData.state.witnessId);

    const currentPool = toArray(roomData.state.questionPool);
    const result = getNextQuestionQueue(currentPool, nonWitnesses, Math.min(3, nonWitnesses.length));

    const drawn = drawThreeCards(roomData.state.markedDeck || []);

    localSelectedCardIndex = 0;
    roomRef.child('state').update({
      phase: 'QUESTION_CHOOSE',
      hintRound: curHintRound + 1,
      questionQueue: result.queue,
      questionPool: result.pool,
      currentQuestionIndex: 0,
      threeCards: drawn.cards,
      markedDeck: drawn.deck,
      currentQuestionCard: null,
      inferences: {},
      history: currentHistory
    });
  }
}

function handleSubmitGuesserVote(targetPid) {
  roomRef.child('state/guesserVotes/' + myPlayerId).set(targetPid).then(() => {
    roomRef.child('state/guesserVotes').get().then(snap => {
      const votes = snap.val() || {};
      const reporterCount = Object.keys(roomData.players || {}).length - 1;
      if (Object.keys(votes).length >= reporterCount) {
        roomRef.child('state').update({ phase: 'SCOOP_RESULT_GUESSER' });
      }
    });
  });
}

function handleProceedAfterGuesserVote(isGuesserIdentified) {
  const correctPids = Object.entries(roomData.state.inferences || {})
    .filter(([_, inf]) => inf.isCorrect)
    .map(([pid]) => pid);

  if (roomData.mode === 'INSIDER') {
    roomRef.child('state').update({
      secretRevealed: isGuesserIdentified,
      phase: 'INSIDER_VOTE',
      votes: {}
    });
  } else {
    applyRoundResults(isGuesserIdentified, correctPids);
  }
}

function handleSubmitInsiderVote(targetPid) {
  roomRef.child('state/votes/' + myPlayerId).set(targetPid).then(() => {
    roomRef.child('state/votes').get().then(snap => {
      const votes = snap.val() || {};
      if (Object.keys(votes).length >= Object.keys(roomData.players).length) {
        roomRef.child('state').update({ phase: 'INSIDER_REVEAL' });
      }
    });
  });
}

function handleResolveInsiderRound(accusedPid) {
  const actualInsiderId = roomData.state.insiderId;
  const isInsiderCaught = (accusedPid === actualInsiderId);
  const secretRevealed = !!roomData.state.secretRevealed;
  applyNewInsiderScores(secretRevealed, isInsiderCaught);
}

function applyNewInsiderScores(hasSecretRevealed, isInsiderCaught) {
  const actualInsiderId = roomData.state.insiderId;
  const witnessId = roomData.state.witnessId;
  const pids = Object.keys(roomData.players);
  const votes = roomData.state.votes || {};

  const correctRegularReporters = Object.entries(roomData.state.inferences || {})
    .filter(([pid, inf]) => inf.isCorrect && pid !== witnessId && pid !== actualInsiderId)
    .map(([pid]) => pid);

  const roundScores = {};
  const scoreDetails = {};
  pids.forEach(pid => {
    roundScores[pid] = 0;
    scoreDetails[pid] = [];
  });

  let patternText = '';
  if (hasSecretRevealed && !isInsiderCaught) {
    patternText = '① 正体発表あり・インサイダー潜伏成功';
    pids.forEach(pid => {
      if (pid === actualInsiderId) {
        roundScores[pid] += 3;
        scoreDetails[pid].push('基本点: +3');
      } else if (pid !== witnessId) {
        roundScores[pid] += 1;
        scoreDetails[pid].push('基本点: +1');
      } else {
        scoreDetails[pid].push('基本点: 0');
      }
    });
  } else if (hasSecretRevealed && isInsiderCaught) {
    patternText = '② 正体発表あり・インサイダー発覚';
    pids.forEach(pid => {
      if (pid === actualInsiderId) {
        roundScores[pid] -= 1;
        scoreDetails[pid].push('基本点: -1');
      } else if (pid !== witnessId) {
        roundScores[pid] += 1;
        scoreDetails[pid].push('基本点: +1');
      } else {
        scoreDetails[pid].push('基本点: 0');
      }
    });
  } else if (!hasSecretRevealed && !isInsiderCaught) {
    patternText = '③ 正体発表なし・インサイダー潜伏成功';
    pids.forEach(pid => {
      scoreDetails[pid].push('基本点: 0');
    });
  } else {
    patternText = '④ 正体発表なし・インサイダー発覚';
    pids.forEach(pid => {
      if (pid === actualInsiderId) {
        roundScores[pid] -= 2;
        scoreDetails[pid].push('基本点: -2');
      } else {
        scoreDetails[pid].push('基本点: 0');
      }
    });
  }

  if (hasSecretRevealed) {
    correctRegularReporters.forEach(pid => {
      roundScores[pid] += 1;
      scoreDetails[pid].push('正解ボーナス: +1');
    });
  }

  Object.entries(votes).forEach(([voterPid, targetPid]) => {
    if (voterPid !== actualInsiderId && targetPid === actualInsiderId) {
      roundScores[voterPid] += 1;
      scoreDetails[voterPid].push('指名ボーナス: +1');
    }
  });

  const finalDetails = {};
  pids.forEach(pid => {
    finalDetails[pid] = scoreDetails[pid].join(' / ');
  });

  const updates = {};
  pids.forEach(pid => {
    const cur = roomData.players[pid]?.score || 0;
    updates[`players/${pid}/score`] = cur + roundScores[pid];
  });

  updates['state/phase'] = 'ROUND_RESULT';
  updates['state/roundSummary'] = {
    scores: roundScores,
    scoreDetails: finalDetails,
    reason: `${patternText} （インサイダー: ${roomData.players[actualInsiderId]?.name}）`
  };

  roomRef.update(updates);
}

function applyRoundResults(isSuccess, correctPids) {
  const updates = {};
  const reason = isSuccess ? 
    '記者がネッシーの正体を暴きました！（正解数を加算）' : 
    '正体は永遠の謎となりました！（正解者なし）';

  if (isSuccess) {
    correctPids.forEach(pid => {
      const cur = roomData.players[pid]?.correctCount || 0;
      updates[`players/${pid}/correctCount`] = cur + 1;
    });
  }

  updates['state/phase'] = 'ROUND_RESULT';
  updates['state/roundSummary'] = { reason: reason };
  roomRef.update(updates);
}

function handleNextRoundOrEnd() {
  const played = toArray(roomData.state?.playedWitnesses);
  startNewWitnessGame(played);
}

function handleLeaveRoom() {
  if (confirm('ルームを退出しますか？')) {
    if (roomRef && myPlayerId) roomRef.child('players/' + myPlayerId).remove();
    if (roomRef) roomRef.off();
    if (reactionRef) reactionRef.off();
    currentRoomId = null; roomData = null; render();
  }
}

function copyInviteUrl() {
  const inviteUrl = window.location.origin + window.location.pathname + '?room=' + currentRoomId;
  navigator.clipboard.writeText(inviteUrl).then(() => showToast('招待URLをコピーしました！')).catch(() => copyRoomCode());
}

function copyRoomCode() {
  navigator.clipboard.writeText(currentRoomId).then(() => showToast('ルームコードをコピーしました！'));
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.remove('opacity-0');
  t.classList.add('opacity-100');
  setTimeout(() => {
    t.classList.remove('opacity-100');
    t.classList.add('opacity-0');
  }, 3000);
}

function escapeHtml(str) {
  if (!str) return '';
  return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
}

// 起動
render();
</script>
